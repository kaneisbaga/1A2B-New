<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1A2B 數字花園</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff7fb;
      --cream: #fffdf7;
      --panel: rgba(255, 255, 255, 0.88);
      --ink: #3b3040;
      --muted: #7b6f82;
      --pink: #ff7eb6;
      --peach: #ffb36f;
      --mint: #63d7b2;
      --aqua: #7cd7f7;
      --lavender: #bda2ff;
      --line: rgba(87, 60, 94, 0.14);
      --shadow: rgba(80, 55, 88, 0.16);
      --danger: #e2526d;
      --success: #2f9e77;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      color: var(--ink);
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
      background:
        radial-gradient(circle at 12% 16%, rgba(255, 126, 182, 0.24), transparent 22%),
        radial-gradient(circle at 88% 12%, rgba(124, 215, 247, 0.24), transparent 24%),
        radial-gradient(circle at 50% 92%, rgba(99, 215, 178, 0.20), transparent 30%),
        linear-gradient(160deg, #fff7fb 0%, #fff8e8 48%, #f2fffb 100%);
		overflow-x: hidden;
		overflow-y: auto;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 8px;
      min-height: 42px;
      padding: 10px 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--peach));
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(255, 126, 182, 0.24);
      transition: transform 0.16s ease, filter 0.16s ease, box-shadow 0.16s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
      box-shadow: 0 14px 28px rgba(255, 126, 182, 0.30);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
      transform: none;
      filter: grayscale(0.2);
      box-shadow: none;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.9);
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    input:focus {
      border-color: rgba(255, 126, 182, 0.72);
      box-shadow: 0 0 0 4px rgba(255, 126, 182, 0.16);
    }

    input::placeholder {
      color: rgba(59, 48, 64, 0.28);
      opacity: 1;
    }

    .guess-input::placeholder {
      color: rgba(59, 48, 64, 0.22);
    }

    .page {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 28px;
    }

    .hero {
      min-height: 188px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 230px;
      gap: 18px;
      align-items: end;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.38)),
        repeating-linear-gradient(45deg, rgba(255, 126, 182, 0.08) 0 14px, rgba(124, 215, 247, 0.08) 14px 28px);
      box-shadow: 0 22px 70px var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .hero:before,
    .hero:after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.56);
      pointer-events: none;
    }

    .hero:before {
      width: 140px;
      height: 140px;
      left: -58px;
      top: -48px;
    }

    .hero:after {
      width: 180px;
      height: 180px;
      right: -70px;
      bottom: -82px;
    }

    .hero-copy,
    .mascot-stage {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: #8d4b67;
      font-size: 14px;
      font-weight: 900;
    }

    .spark {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      background: var(--mint);
      transform: rotate(45deg);
      box-shadow: 18px -4px 0 -2px var(--peach), 32px 6px 0 -3px var(--aqua);
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 8vw, 76px);
      line-height: 0.92;
      letter-spacing: 0;
      color: #45334a;
    }

    .subtitle {
      max-width: 620px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .mascot-stage {
      min-height: 156px;
      display: grid;
      place-items: center;
    }

    .mascot {
      width: 142px;
      height: 120px;
      border: 3px solid rgba(69, 51, 74, 0.12);
      border-radius: 48% 48% 42% 42%;
      background:
        radial-gradient(circle at 31% 42%, #3b3040 0 7px, transparent 8px),
        radial-gradient(circle at 69% 42%, #3b3040 0 7px, transparent 8px),
        radial-gradient(ellipse at 50% 62%, #ff8fbf 0 12px, transparent 13px),
        linear-gradient(160deg, #fff 0%, #ffe1ee 100%);
      box-shadow: 0 18px 40px rgba(255, 126, 182, 0.28);
      position: relative;
      animation: bob 2.8s ease-in-out infinite;
    }

    .mascot:before,
    .mascot:after {
      content: "";
      position: absolute;
      width: 46px;
      height: 58px;
      top: -28px;
      border-radius: 48% 48% 12px 12px;
      background: linear-gradient(160deg, #fff, #ffd6e6);
      border: 3px solid rgba(69, 51, 74, 0.10);
      z-index: -1;
    }

    .mascot:before {
      left: 20px;
      transform: rotate(-16deg);
    }

    .mascot:after {
      right: 20px;
      transform: rotate(16deg);
    }

    .cheek {
      position: absolute;
      top: 58px;
      width: 20px;
      height: 12px;
      border-radius: 999px;
      background: rgba(255, 126, 182, 0.38);
    }

    .cheek.left { left: 22px; }
    .cheek.right { right: 22px; }

    .bow {
      position: absolute;
      right: -16px;
      top: 18px;
      width: 38px;
      height: 30px;
      background:
        radial-gradient(circle at 50% 50%, #fff4b8 0 5px, transparent 6px),
        linear-gradient(90deg, var(--aqua) 0 45%, transparent 45% 55%, var(--aqua) 55%);
      border-radius: 16px;
      transform: rotate(14deg);
      box-shadow: 0 8px 18px rgba(124, 215, 247, 0.28);
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 14px;
      margin-top: 14px;
    }

    .main,
    .side {
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 48px rgba(80, 55, 88, 0.12);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.42);
    }

    .panel-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .panel-body {
      padding: 16px;
    }

    .play-grid {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 12px;
      align-items: end;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .guess-box {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .guess-input {
      min-height: 58px;
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .message {
      min-height: 44px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px dashed rgba(255, 126, 182, 0.38);
      border-radius: 8px;
      background: rgba(255, 246, 250, 0.72);
      color: #7a4d61;
      line-height: 1.5;
    }

    .message.good {
      border-color: rgba(47, 158, 119, 0.36);
      background: rgba(239, 255, 248, 0.84);
      color: var(--success);
    }

    .message.bad {
      border-color: rgba(226, 82, 109, 0.34);
      background: rgba(255, 241, 244, 0.86);
      color: var(--danger);
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .chip {
      min-height: 76px;
      display: grid;
      align-content: center;
      gap: 4px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
    }

    .chip span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .chip strong {
      font-size: 24px;
      line-height: 1;
    }

    .xp-bar {
      height: 14px;
      border-radius: 999px;
      background: rgba(69, 51, 74, 0.10);
      overflow: hidden;
      border: 1px solid rgba(69, 51, 74, 0.08);
    }

    .xp-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--mint), var(--aqua), var(--lavender));
      transition: width 0.35s ease;
    }

    .history {
      display: grid;
      gap: 4px;
      max-height: 430px;
      overflow: auto;
      padding-right: 3px;
    }

    .guess-row,
    .rank-row {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.66);
    }

    .turn {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, var(--lavender), var(--aqua));
      font-size: 11px;
    }

    .guess-code {
      font-size: 18px;
      letter-spacing: 0;
    }

    .result {
      min-width: 60px;
      text-align: center;
      border-radius: 999px;
      padding: 4px 8px;
      color: #7a4d61;
      background: rgba(255, 126, 182, 0.13);
	    font-size: 14px;
    }

    .rank-row {
      grid-template-columns: 34px 1fr auto;
    }

    .rank-name {
      min-width: 0;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rank-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .score {
      font-weight: 900;
      color: #8d4b67;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .soft {
      color: #7a4d61;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 126, 182, 0.26);
      box-shadow: none;
    }

    .empty {
      padding: 18px 12px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed rgba(87, 60, 94, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.42);
      line-height: 1.6;
    }

    .rules {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.75;
      font-size: 14px;
    }

    .rules strong {
      color: var(--ink);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 5;
      transform: translate(-50%, 120px);
      width: min(440px, calc(100vw - 28px));
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 20px 44px rgba(80, 55, 88, 0.2);
      color: var(--ink);
      transition: transform 0.25s ease;
    }

    .toast.show {
      transform: translate(-50%, 0);
    }

.viewport {
  width: 100%;
  min-height: 100vh;
  position: relative;
}

    @media (max-width: 900px) {
      .hero,
      .layout,
      .play-grid {
        grid-template-columns: 1fr;
      }

      .mascot-stage {
        min-height: 130px;
      }

      .chips {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .page {
        width: min(100vw - 16px, 1180px);
        padding-top: 8px;
      }

      .hero {
        padding: 18px;
      }

      h1 {
        font-size: 42px;
      }

      .guess-box {
        grid-template-columns: 1fr;
      }

      .guess-input {
        min-height: 54px;
        font-size: 26px;
      }

      .guess-row {
  grid-template-columns: 34px 1fr auto;
  gap: 6px;
  padding: 4px 8px;
  min-height: 0;
}


      .guess-row .result {
        grid-column: 2;
        width: fit-content;
      }
    }

    .page {
  width: min(1180px, calc(100vw - 20px));
  margin: 0 auto;
  padding: 10px;
  position: relative;
  left: auto;
  top: auto;
  transform: none;
}

    .hero {
      min-height: 76px;
      grid-template-columns: minmax(0, 1fr) 118px;
      gap: 10px;
      padding: 10px 18px;
    }

    h1 {
      font-size: 36px;
      line-height: 1;
      white-space: nowrap;
    }

    .subtitle {
      max-width: 820px;
      margin-top: 4px;
      font-size: 13px;
      line-height: 1.35;
    }

    .eyebrow {
      margin-bottom: 3px;
      font-size: 11px;
    }

    .mascot-stage {
      min-height: 68px;
    }

    .mascot {
      transform: scale(0.48);
      animation: none;
    }

    .layout {
      height: 614px;
      grid-template-columns: 1fr 326px;
      gap: 10px;
      margin-top: 10px;
    }

    .main,
    .side {
      gap: 10px;
      min-height: 0;
    }

    .main {
      grid-template-rows: auto minmax(0, 1fr);
    }

    .side {
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .panel {
      min-height: 0;
    }

    .main .panel:nth-child(2),
    .main .panel:nth-child(2) .panel-body,
    .side .panel:nth-child(2),
    .side .panel:nth-child(2) .panel-body {
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .main .panel:nth-child(2) .panel-body,
    .side .panel:nth-child(2) .panel-body {
      flex: 1;
    }

    .panel-head {
      min-height: 44px;
      padding: 8px 12px;
    }

    .panel-body {
      padding: 10px 12px;
    }

    .play-grid {
      grid-template-columns: 1fr 178px;
      gap: 8px;
    }

    .guess-input {
      min-height: 44px;
      font-size: 26px;
    }

    .message {
      min-height: 34px;
      margin-top: 6px;
      padding: 7px 10px;
      font-size: 13px;
    }

    .guess-box {
      margin-top: 8px;
    }

    .field label {
      margin-bottom: 5px;
    }

    .history {
      max-height: none;
      min-height: 0;
      flex: 1;
    }

    .side .history {
      max-height: none;
    }

    .chips {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .chip {
      min-height: 48px;
      padding: 7px 8px;
      overflow: hidden;
    }

    .chip strong {
      font-size: 20px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip span {
      font-size: 11px;
      white-space: nowrap;
    }

    .rules {
      font-size: 12px;
      line-height: 1.4;
    }

    .rank-row {
      grid-template-columns: 30px minmax(0, 1fr) 58px;
      gap: 8px;
      padding: 8px;
    }

    .score {
      min-width: 0;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="viewport">
  <main class="page">
    <section class="hero" aria-label="1A2B 數字花園">
      <div class="hero-copy">
        <div class="eyebrow"><span class="spark" aria-hidden="true"></span>每日挑戰 · 經驗成長 · 答對上傳</div>
        <h1>1A2B 數字花園</h1>
      <p class="subtitle">輸入 4 個不重複的 0-9 數字。每一次猜題都會得到 A/B 線索，慢慢推理出今天最可愛的答案。</p>
      </div>
      <div class="mascot-stage" aria-hidden="true">
        <div class="mascot">
          <span class="cheek left"></span>
          <span class="cheek right"></span>
          <span class="bow"></span>
        </div>
      </div>
    </section>

    <section class="layout">
      <div class="main">
        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">猜題區</h2>
            <div class="toolbar">
              <button class="soft" id="newGameBtn" type="button">新的一局</button>
            </div>
          </div>
          <div class="panel-body">
            <div class="play-grid">
<div class="field">
  <label for="playerName">玩家暱稱</label>

  <div style="display:flex; gap:8px;">
    <input id="playerName" maxlength="16" autocomplete="nickname" placeholder="請輸入名字">

    <button id="confirmNameBtn" type="button" style="min-width:80px;">
      確認
    </button>
  </div>
</div>
              <div class="field">
                <label for="guessInput">本次猜題</label>
                <input id="guessInput" class="guess-input" inputmode="numeric" maxlength="4" placeholder="0123" autocomplete="off">
              </div>
            </div>
            <div class="guess-box">
              <button id="guessBtn" type="button">送出猜題</button>
            </div>
            <div id="message" class="message">輸入 4 個不重複的數字，開始今天的數字挑戰。</div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">本局紀錄</h2>
            <span id="answerState" class="score">準備挑戰</span>
          </div>
          <div class="panel-body">
            <div id="history" class="history">
              <div class="empty">還沒有猜題紀錄。</div>
            </div>
          </div>
        </section>
      </div>

      <aside class="side">
        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">角色經驗</h2>
            <span id="levelLabel" class="score">Lv.1</span>
          </div>
          <div class="panel-body">
            <div class="chips">
              <div class="chip"><span>總經驗</span><strong id="totalExp">0</strong></div>
              <div class="chip"><span>今日勝場</span><strong id="todayWins">0</strong></div>
              <div class="chip"><span>連勝</span><strong id="streak">0</strong></div>
              <div class="chip"><span>最佳步數</span><strong id="bestCount">-</strong></div>
            </div>
            <div style="height: 14px"></div>
            <div class="xp-bar" aria-label="升級進度"><div id="xpFill" class="xp-fill"></div></div>
            <div id="xpText" class="rank-meta" style="margin-top: 8px">再 80 EXP 升級</div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">每日排行榜</h2>
            <button class="soft" id="clearRankBtn" type="button">重新整理</button>
          </div>
          <div class="panel-body">
            <div id="leaderboard" class="history"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">遊戲資訊</h2>
          </div>
          <div class="panel-body">
            <ul class="rules">
              <li>每一局答案與猜題都是 4 位不重複數字，可使用 0 開頭。</li>
              <li>用每次回饋慢慢縮小範圍，越少次完成分數越高。</li>
              <li>答對後會獲得經驗、更新每日榜，並送出紀錄到 Google 試算表。</li>
            </ul>
          </div>
        </section>
      </aside>
    </section>
  </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxZOv3amV9yyn-nR2A0e0Wc2so2c4FzIbZHnXVbQLd4HYe8REoLsgItmp8tzxvMm6mf/exec";
    const DIGITS = "0123456789";
    const CODE_LENGTH = 4;
    const STORE = {
      profile: "ab_cute_profile_v1",
      leaderboard: "ab_cute_leaderboard_v1"
    };

    const els = {
      playerName: document.querySelector("#playerName"),
      guessInput: document.querySelector("#guessInput"),
      guessBtn: document.querySelector("#guessBtn"),
      newGameBtn: document.querySelector("#newGameBtn"),
      clearRankBtn: document.querySelector("#clearRankBtn"),
		confirmNameBtn: document.querySelector("#confirmNameBtn"),
      message: document.querySelector("#message"),
      history: document.querySelector("#history"),
      answerState: document.querySelector("#answerState"),
      totalExp: document.querySelector("#totalExp"),
      todayWins: document.querySelector("#todayWins"),
      streak: document.querySelector("#streak"),
      bestCount: document.querySelector("#bestCount"),
      levelLabel: document.querySelector("#levelLabel"),
      xpFill: document.querySelector("#xpFill"),
      xpText: document.querySelector("#xpText"),
      leaderboard: document.querySelector("#leaderboard"),
      toast: document.querySelector("#toast")
    };

    let allCodes = [];
    let profile = loadProfile();
    let game = createGame();
    let cloudTimer = 0;

    function createGame() {
      return {
        answer: "",
        firstGuess: "",
        guesses: [],
        finished: false,
        startedAt: new Date()
      };
    }

    function uniqueCodes() {
      const codes = [];
      for (const a of DIGITS) {
        for (const b of DIGITS) {
          for (const c of DIGITS) {
            for (const d of DIGITS) {
              const code = a + b + c + d;
              if (new Set(code).size === CODE_LENGTH) codes.push(code);
            }
          }
        }
      }
      return codes;
    }

    function blankProfile(name = "") {
      return {
        name,
        totalExp: 0,
        streak: 0,
        winsByDate: {},
        bestCount: null
      };
    }

    function profileKey(name) {
      const normalized = name.trim();
      return normalized ? `${STORE.profile}_${normalized}` : STORE.profile;
    }

    function loadProfile(name = "") {
      try {
        const stored = localStorage.getItem(profileKey(name));
        if (stored) return { ...blankProfile(name), ...JSON.parse(stored), name };
      } catch {
        return blankProfile(name);
      }

      return blankProfile(name);
    }

    function saveProfile() {
      localStorage.setItem(profileKey(profile.name), JSON.stringify(profile));
    }

    function todayKey() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function isValidGuess(value) {
      return new RegExp(`^[0-9]{${CODE_LENGTH}}$`).test(value) && new Set(value).size === CODE_LENGTH;
    }

    function compareCodes(guess, answer) {
      let a = 0;
      let b = 0;

      for (let i = 0; i < CODE_LENGTH; i += 1) {
        if (guess[i] === answer[i]) {
          a += 1;
        } else if (answer.includes(guess[i])) {
          b += 1;
        }
      }

      return { a, b, text: `${a}A${b}B` };
    }

    function randomIndex(max) {
      if (window.crypto && typeof window.crypto.getRandomValues === "function") {
        const values = new Uint32Array(1);
        window.crypto.getRandomValues(values);
        return values[0] % max;
      }

      return Math.floor(Math.random() * max);
    }

    function generateAnswerFromFirstGuess(firstGuess) {
      const candidates = allCodes.filter((code) => {
        const result = compareCodes(firstGuess, code);
        return result.a < 2 && result.a + result.b > 0;
      });

      return candidates[randomIndex(candidates.length)];
    }

    function cleanGuessInput() {
      els.guessInput.value = els.guessInput.value.replace(/\D/g, "").slice(0, CODE_LENGTH);
    }

    function setMessage(text, type = "") {
      els.message.textContent = text;
      els.message.className = `message ${type}`.trim();
    }

    function submitGuess() {
      cleanGuessInput();
      const guess = els.guessInput.value;
      const name = els.playerName.value.trim() || "花園玩家";
      syncProfileName(name);

      if (!isValidGuess(guess)) {
        setMessage("請輸入 4 個不重複的 0-9 數字，例如 0123。", "bad");
        els.guessInput.select();
        return;
      }

      if (game.finished) {
        setMessage("這局已經答對了，按「新的一局」再玩一次。", "good");
        return;
      }

      if (!game.answer) {
        game.firstGuess = guess;
        game.answer = generateAnswerFromFirstGuess(guess);
        els.answerState.textContent = "挑戰中";
      }

      const result = compareCodes(guess, game.answer);
      game.guesses.push({ guess, result: result.text });
      renderHistory();

      if (result.a === CODE_LENGTH) {
        finishGame(name);
      } else if (name === "00V0" && game.guesses.length === 1) {
        window.setTimeout(autoGuessAnswer, 420);
      } else {
        setMessage(`第 ${game.guesses.length} 次是 ${result.text}，再把線索揉一揉就更接近了。`);
      }

      els.guessInput.value = "";
      els.guessInput.focus();
    }

    function autoGuessAnswer() {
      if (game.finished || !game.answer || els.playerName.value.trim() !== "00V0") return;
      els.guessInput.value = game.answer;
      submitGuess();
    }

    function scoreFor(count, startedAt) {
      const seconds = Math.max(1, Math.round((Date.now() - startedAt.getTime()) / 1000));
      const countBonus = Math.max(0, 1200 - count * 90);
      const timeBonus = Math.max(0, 320 - seconds * 2);
      return 500 + countBonus + timeBonus;
    }

    function expFor(count, score) {
      return Math.max(40, 120 - count * 8) + Math.floor(score / 80);
    }

    function levelInfo(totalExp) {
      let level = 1;
      let remaining = totalExp;
      let need = 80;

      while (remaining >= need) {
        remaining -= need;
        level += 1;
        need = 80 + (level - 1) * 35;
      }

      return {
        level,
        current: remaining,
        need,
        pct: Math.round((remaining / need) * 100)
      };
    }

    function finishGame(name) {
      game.finished = true;
      const count = game.guesses.length;
      const score = scoreFor(count, game.startedAt);
      const earnedExp = expFor(count, score);
      const date = todayKey();
      const process = game.guesses.map((item, index) => `${index + 1}. ${item.guess} ${item.result}`).join(" / ");

      profile.name = name;
      profile.totalExp += earnedExp;
      profile.streak += 1;
      profile.winsByDate[date] = (profile.winsByDate[date] || 0) + 1;
      profile.bestCount = profile.bestCount === null ? count : Math.min(profile.bestCount, count);
      saveProfile();

      const record = {
        name,
        count,
        totalExp: profile.totalExp,
        score,
        answer: game.answer,
        process,
        date,
        result: "win"
      };

      postWin(record).finally(() => {
        window.setTimeout(() => loadCloudData(name), 1200);
      });
      renderProfile();
      setMessage(`答對了！答案是 ${game.answer}，本局獲得 ${earnedExp} EXP 和 ${score} 分。`, "good");
      showToast("勝利紀錄已送往 Google 試算表，排行榜會自動更新。");
    }

    async function postWin(record) {
      if (new URLSearchParams(location.search).get("test") === "1") return;

      try {
        await fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(record)
        });
      } catch (error) {
        console.warn("Google Apps Script submit failed", error);
        showToast("本機已保存勝利紀錄，但送到 Google 試算表時遇到網路限制。");
      }
    }

    function jsonp(params) {
      return new Promise((resolve, reject) => {
        const callback = `abGardenJsonp_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
        const script = document.createElement("script");
        const url = new URL(GAS_URL);
        Object.entries({ ...params, callback }).forEach(([key, value]) => url.searchParams.set(key, value));

        window[callback] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("Google Sheet read failed"));
        };

        function cleanup() {
          delete window[callback];
          script.remove();
        }

        script.src = url.toString();
        document.body.appendChild(script);
      });
    }

    async function loadCloudData(name = els.playerName.value.trim()) {
      try {
        const data = await jsonp({ action: "summary", name, date: todayKey() });
        if (!data || data.success === false) throw new Error(data && data.error ? data.error : "No data");

        if (data.player) {
          profile = {
            ...blankProfile(name),
            ...profile,
            name,
            totalExp: Number(data.player.totalExp || 0),
            streak: Number(data.player.streak || 0),
            bestCount: data.player.bestCount ? Number(data.player.bestCount) : null,
            winsByDate: { ...profile.winsByDate, [todayKey()]: Number(data.player.todayWins || 0) }
          };
          saveProfile();
          renderProfile();
        }

        renderLeaderboard(data.leaderboard || []);
      } catch (error) {
        console.warn("Google Sheet read failed", error);
        renderLeaderboard();
        showToast("目前讀不到 Google 試算表資料，暫時顯示本機快取。");
      }
    }

    function renderHistory() {
      if (!game.guesses.length) {
        els.history.innerHTML = '<div class="empty">還沒有猜題紀錄。</div>';
        return;
      }

      els.history.innerHTML = game.guesses.map((item, index) => `
        <div class="guess-row">
          <div class="turn">${index + 1}</div>
          <div class="guess-code">${item.guess}</div>
          <div class="result">${item.result}</div>
        </div>
      `).join("");
    }

    function renderProfile() {
      const info = levelInfo(profile.totalExp);
      const date = todayKey();
      els.playerName.value = profile.name || els.playerName.value;
      els.totalExp.textContent = String(profile.totalExp);
      els.todayWins.textContent = String(profile.winsByDate[date] || 0);
      els.streak.textContent = String(profile.streak);
      els.bestCount.textContent = profile.bestCount === null ? "-" : String(profile.bestCount);
      els.levelLabel.textContent = `Lv.${info.level}`;
      els.xpFill.style.width = `${info.pct}%`;
      els.xpText.textContent = `本級 ${info.current} / ${info.need} EXP`;
    }

    function syncProfileName(name) {
      if (profile.name === name) return;
      profile = loadProfile(name);
      profile.name = name;
      renderProfile();
      window.clearTimeout(cloudTimer);
      cloudTimer = window.setTimeout(() => loadCloudData(name), 380);
    }

    function renderLeaderboard(records = []) {
      records = records
        .sort((a, b) => Number(b.score || 0) - Number(a.score || 0) || Number(a.count || 999) - Number(b.count || 999));

      if (!records.length) {
        els.leaderboard.innerHTML = '<div class="empty">今天還沒有雲端紀錄，第一名正在等你。</div>';
        return;
      }

      els.leaderboard.innerHTML = records.map((item, index) => `
        <div class="rank-row">
          <div class="turn">${index + 1}</div>
          <div>
            <div class="rank-name">${escapeHtml(item.name)}</div>
            <div class="rank-meta">最佳 ${item.count} 次 · 今日通關 ${item.wins || 1} 次</div>
          </div>
          <div class="score">${item.score}</div>
        </div>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function newGame() {
      game = createGame();
      els.answerState.textContent = "準備挑戰";
      els.guessInput.value = "";
      renderHistory();
      setMessage("新的花園已經準備好。輸入 4 個不重複的數字開始挑戰。");
      els.guessInput.focus();
    }

    function refreshCloudData() {
      loadCloudData(els.playerName.value.trim());
      showToast("正在重新讀取 Google 試算表。");
    }

    function showToast(text) {
      els.toast.textContent = text;
      els.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 2600);
    }

    allCodes = uniqueCodes();
       renderProfile();
    loadCloudData(profile.name || "");
    renderHistory();

    els.guessInput.addEventListener("input", cleanGuessInput);
    els.guessInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") submitGuess();
    });

    els.guessBtn.addEventListener("click", submitGuess);
    els.newGameBtn.addEventListener("click", newGame);
    els.clearRankBtn.addEventListener("click", refreshCloudData);
	  els.confirmNameBtn.addEventListener("click", () => {
  const name = els.playerName.value.trim() || "花園玩家";
  syncProfileName(name);
  showToast("玩家資料已同步。");
});
  </script>
</body>
</html>
